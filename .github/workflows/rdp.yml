name: RedHost RDP Runner

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set custom RDP Password (Leave blank for default)'
        required: false
        default: 'Rasel2018@'

jobs:
  build:
    runs-on: windows-latest

    steps:
    # ১. কোড চেকআউট
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. Windows Admin পাসওয়ার্ড সেট করা
    - name: Configure RDP Password
      run: |
        $Password = "${{ github.event.inputs.rdp_password }}"
        net user runneradmin $Password
        Write-Output "RDP Password successfully set!"

    # ৩. Tailscale ইনস্টল ও API দিয়ে জেনারেট করা Key দিয়ে কানেক্ট করা
    - name: Install & Connect Tailscale
      shell: powershell
      env:
        TS_CLIENT_ID: ${{ secrets.TAILSCALE_CLIENT_ID }}
        TS_CLIENT_SECRET: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
      run: |
        # ১. OAuth Access Token তৈরি
        $body = @{
            client_id     = $env:TS_CLIENT_ID
            client_secret = $env:TS_CLIENT_SECRET
        }
        $tokenResponse = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/oauth/token" -Method Post -Body $body
        $accessToken = $tokenResponse.access_token

        # ২. API দিয়ে নতুন Auth Key জেনারেট করা
        $headers = @{
            Authorization = "Bearer $accessToken"
        }
        $keyBody = @{
            capabilities = @{
                devices = @{
                    create = @{
                        reusable      = $false
                        ephemeral     = $true
                        preauthorized = $true
                        tags          = @("tag:ci")
                    }
                }
            }
        } | ConvertTo-Json -Depth 5

        $keyResponse = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" -Method Post -Headers $headers -Body $keyBody -ContentType "application/json"
        $authKey = $keyResponse.key

        # ৩. Tailscale ডাউনলোড ও ইনস্টল
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

        # ৪. Tailscale কানেক্ট করা
        $env:Path += ";C:\Program Files\Tailscale"
        tailscale up --authkey=$authKey --unattended

        Write-Output "Tailscale successfully connected!"

    # ৪. RDP চালু রাখা (৬ ঘণ্টার জন্য)
    - name: Keep RDP Active (6 Hours)
      run: |
        Write-Output "RDP is active. You can now connect via Tailscale."
        Start-Sleep -Seconds 21600
